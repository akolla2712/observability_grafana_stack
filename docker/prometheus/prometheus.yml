global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: "usm-inventory"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["usm-inventory:8080"]
  - job_name: "usm-agent"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["usm-agent:8081"]
