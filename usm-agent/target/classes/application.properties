spring.application.name=usm-agent
server.port=8081

# Local H2 database for repository layer
spring.datasource.url=jdbc:h2:mem:usmagentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# External asset service endpoints
asset.search.url=http://usm-inventory:8080/search-asset
asset.create.url=http://usm-inventory:8080/create-asset

management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://tempo:9411/api/v2/spans

logging.level.org.springframework.web=INFO
logging.level.com.poc.observability.metrics=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%level] [trace=%X{traceId:-N/A}] [span=%X{spanId:-N/A}] %msg%n
