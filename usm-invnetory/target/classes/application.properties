spring.application.name=usm-inventory
server.port=8080

# Docker Compose runtime
spring.neo4j.uri=bolt://neo4j:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=neo4j@123

# Local host fallback (optional for non-containerized runs)
# spring.neo4j.uri=bolt://localhost:7687

management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://tempo:9411/api/v2/spans

logging.level.org.springframework.web=INFO
logging.level.com.poc.observability.metrics=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%level] [trace=%X{traceId:-N/A}] [span=%X{spanId:-N/A}] %msg%n
